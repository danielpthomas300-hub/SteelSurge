name: Refresh site data

# Pulls the newest YouTube videos and a backup copy of FTCScout stats once a day,
# and commits them only if something changed. No secrets needed.
on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/refresh-data.mjs
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "steel-surge-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Auto-refresh videos and stats"
            git push
          else
            echo "Nothing changed."
          fi
