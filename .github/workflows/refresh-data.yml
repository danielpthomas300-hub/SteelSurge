name: Refresh site data

# Pulls the newest YouTube videos and a backup copy of FTCScout stats once a day,
# refreshes the FTC team list for the Kilovolt game once a week (Mondays),
# and commits only if something changed. No secrets needed.
on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/refresh-data.mjs
      - name: Weekly FTC team list (Kilovolt)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node tools/fetch-teams.mjs || echo "Team refresh failed; keeping the existing list."
          fi
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "steel-surge-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Auto-refresh videos, stats, and team list"
            git push
          else
            echo "Nothing changed."
          fi
